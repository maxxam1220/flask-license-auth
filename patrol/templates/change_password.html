{% extends 'base.html' %}{% from '_ui.html' import icon, csrf %}{% set title='變更密碼' %}
{% block content %}<div class="narrow-page"><div class="page-heading"><div><div class="eyebrow">帳號設定</div><h1>{{ '設定你的新密碼' if current_user.must_change_password else '變更密碼' }}</h1><p>{{ '首次登入，請先更改管理員提供的初始密碼。' if current_user.must_change_password else '變更密碼後，其他登入階段將失效。' }}</p></div></div><section class="panel"><form method="post" action="{{ url_for('change_password') }}" class="form-stack">{{ csrf() }}<input type="hidden" name="next" value="{{ next_url|default('') }}"><label>目前密碼<input type="password" name="current_password" required autocomplete="current-password"></label><label>新密碼<input type="password" name="new_password" required minlength="12" autocomplete="new-password"><small>至少 12 個字元，請避免與其他網站共用。</small></label><label>再次輸入新密碼<input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label><button class="button button-primary">{{ icon('key') }}儲存新密碼</button></form></section></div>{% endblock %}
