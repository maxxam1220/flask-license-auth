{% from '_ui.html' import icon %}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack">
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="{{ 'alert' if category in ['error', 'danger'] else 'status' }}">
          {{ icon('circle-check' if category == 'success' else 'info') }}<span>{{ t(message) }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
