{% extends 'base.html' %}{% from '_ui.html' import icon %}{% set title='無法完成操作' %}
{% block content %}<div class="error-state"><span class="error-number">{{ code }}</span><h1>{{ message }}</h1><p>請確認操作或連結是否正確。如果問題持續，請聯繫管理員。</p><a class="button button-primary" href="{{ recovery_url or (url_for('dashboard') if current_user else url_for('login')) }}">{{ icon('back') }}{{ recovery_label or ('返回巡檢總覽' if current_user else '返回登入') }}</a></div>{% endblock %}
