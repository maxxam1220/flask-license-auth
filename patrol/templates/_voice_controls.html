{# Shown by patrol-voice.js only after the browser capability and preference are known. #}
{% macro voice_controls() -%}
<div class="patrol-voice-controls" data-voice-controls role="group" aria-label="{{ t('語音提示') }}" data-i18n-aria-label="語音提示" hidden>
  <div class="patrol-voice-actions">
    <button class="patrol-voice-button patrol-voice-toggle" type="button" data-voice-toggle role="switch" aria-checked="false">
      <svg class="patrol-voice-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
      <span class="patrol-voice-label" data-i18n="語音提示">{{ t('語音提示') }}</span>
      <span class="patrol-voice-state" data-voice-state data-i18n="關閉" aria-hidden="true">{{ t('關閉') }}</span>
    </button>
    <button class="patrol-voice-button patrol-voice-replay" type="button" data-voice-replay disabled hidden>
      <svg class="patrol-voice-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg>
      <span class="patrol-voice-label" data-i18n="重播結果">{{ t('重播結果') }}</span>
    </button>
  </div>
  <p class="patrol-voice-status" data-voice-status role="status" aria-live="polite" aria-atomic="true"><span data-i18n="未聽到提示時可重播；請以畫面結果為準。">{{ t('未聽到提示時可重播；請以畫面結果為準。') }}</span></p>
</div>
{%- endmacro %}
